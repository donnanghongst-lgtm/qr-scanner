<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769aa">
  <title>Scanner QR ตรวจสอบการจ่ายสินค้า</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f3f6fa; color: #182230;
    }
    main {
      max-width: 600px; margin: 10px auto; padding: 18px;
      background: #fff; border-radius: 16px;
      box-shadow: 0 2px 14px #00000012; text-align: center;
    }
    h2 { color:#174a7e; margin: 0 0 10px; }
    #reader { width:100%; margin:16px auto; overflow:hidden; border-radius:12px; }
    button {
      border:0; border-radius:9px; padding:13px 18px; margin:5px;
      background:#1769aa; color:#fff; font-size:17px;
    }
    button.secondary { background:#667085; }
    button:disabled { opacity:.5; }
    #status { margin-top:12px; font-size:16px; line-height:1.5; }
    .hint { color:#667085; font-size:13px; line-height:1.5; }
  </style>
</head>
<body>
<main>
  <h2>สแกน QR ตรวจสอบการจ่ายสินค้า</h2>
  <p>กดเริ่มสแกน แล้วอนุญาตให้ Safari ใช้กล้อง</p>

  <div id="reader"></div>

  <button id="startBtn" onclick="startScan()">เริ่มสแกนกล้อง</button>
  <button id="stopBtn" class="secondary" onclick="stopScan()" disabled>หยุดกล้อง</button>

  <div id="status">พร้อมใช้งาน</div>
  <p class="hint">
    หากอนุญาตกล้องแล้วแต่ไม่เปิด ให้ปิดหน้าเว็บ Scanner แล้วเปิดใหม่จาก HTTPS
  </p>
</main>

<script>
const APP_URL = 'https://script.google.com/macros/s/AKfycbxfDVCsJowdrDaCCoxGzDZ-80AD5OExgGXK7ZAamRnBoE1O26LtT2vv7tpBgFoS-Fq80w/exec';

let scanner = null;
let starting = false;
let scanning = false;
let locked = false;

const $ = id => document.getElementById(id);

function status(msg, error=false) {
  $("status").textContent = msg;
  $("status").style.color = error ? "#b42318" : "#344054";
}

async function getCamerasAfterPermission() {
  // ขอ permission ก่อน เพื่อให้ iPhone Safari เปิดเผยรายการกล้อง
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
  } finally {
    if (stream) {
      stream.getTracks().forEach(track => {
        try { track.stop(); } catch(e) {}
      });
    }
  }

  const cameras = await Html5Qrcode.getCameras();
  if (!cameras || !cameras.length) {
    throw new Error("ไม่พบกล้องของ iPhone");
  }
  return cameras;
}

function chooseBackCamera(cameras) {
  const list = cameras || [];

  // หลังจาก permission แล้ว iPhone มักจะมี label ให้เลือก
  const back = list.find(c => {
    const label = String(c.label || "").toLowerCase();
    return label.includes("back") ||
           label.includes("rear") ||
           label.includes("environment") ||
           label.includes("หลัง");
  });

  return back || list[list.length - 1];
}

async function startScan() {
  if (starting || scanning) return;

  if (!window.isSecureContext) {
    status("หน้านี้ไม่ใช่ HTTPS จึงเปิดกล้องไม่ได้", true);
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status("Safari รุ่นนี้ไม่รองรับการเปิดกล้องผ่านเว็บ กรุณาอัปเดต iOS/Safari", true);
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    status("โหลดระบบอ่าน QR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต", true);
    return;
  }

  starting = true;
  locked = false;
  $("startBtn").disabled = true;
  status("กำลังขอสิทธิ์และตรวจสอบกล้อง...");

  try {
    if (scanner) {
      try { if (scanning) await scanner.stop(); } catch(e) {}
      try { await scanner.clear(); } catch(e) {}
      scanner = null;
      scanning = false;
    }

    scanner = new Html5Qrcode("reader");

    const cameras = await getCamerasAfterPermission();
    const camera = chooseBackCamera(cameras);

    status("กำลังเปิดกล้อง: " + (camera.label || "กล้องหลัง") + "...");

    await scanner.start(
      camera.id,
      {
        fps: 10,
        qrbox: function(width, height) {
          const size = Math.max(180, Math.min(width, height, 280));
          return { width:size, height:size };
        },
        aspectRatio: 1
      },
      async function(decodedText) {
        if (locked) return;

        const customerId = String(decodedText || "").trim().toUpperCase();
        if (!customerId) return;

        locked = true;
        status("อ่าน QR สำเร็จ: " + customerId + " กำลังเปิดข้อมูล...");

        await stopScan(false);

        const url = APP_URL + "?customerId=" + encodeURIComponent(customerId);
        window.location.replace(url);
      },
      function(errorMessage) {
        // ไม่แสดง error ทุก frame เพราะ callback นี้ทำงานตลอดเวลาที่ยังหา QR ไม่พบ
      }
    );

    scanning = true;
    $("stopBtn").disabled = false;
    status("เปิดกล้องสำเร็จ กรุณาส่อง QR Code");
  } catch (e) {
    console.error("START CAMERA ERROR:", e);

    scanning = false;
    scanner = null;

    let message = e && e.message ? e.message : String(e);

    if (e && (e.name === "NotAllowedError" || e.name === "PermissionDeniedError")) {
      message = "Safari อนุญาตกล้องแล้ว แต่ยังเริ่มกล้องไม่ได้ ให้ปิดหน้า Scanner แล้วเปิดใหม่ และตรวจสอบ การตั้งค่า > Apps > Safari > Camera > Allow";
    } else if (e && (e.name === "NotFoundError" || e.name === "DevicesNotFoundError")) {
      message = "ไม่พบกล้องของ iPhone";
    } else if (e && (e.name === "NotReadableError" || e.name === "TrackStartError")) {
      message = "กล้องกำลังถูกใช้งานโดยแอปหรือหน้าเว็บอื่น กรุณาปิดแอปกล้อง/หน้าเว็บอื่นแล้วลองใหม่";
    }

    status("เปิดกล้องไม่สำเร็จ: " + message, true);
    $("startBtn").disabled = false;
    $("stopBtn").disabled = true;
  } finally {
    starting = false;
  }
}

async function stopScan(showMessage=true) {
  const old = scanner;
  scanning = false;
  $("stopBtn").disabled = true;

  if (!old) {
    $("startBtn").disabled = false;
    if (showMessage) status("หยุดกล้องแล้ว");
    return;
  }

  try { await old.stop(); } catch(e) {}
  try { await old.clear(); } catch(e) {}

  if (scanner === old) scanner = null;

  $("startBtn").disabled = false;
  if (showMessage) status("หยุดกล้องแล้ว");
}

window.addEventListener("beforeunload", () => {
  try { if (scanner && scanning) scanner.stop(); } catch(e) {}
});
</script>
</body>
</html>
